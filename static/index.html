
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mergington High School Activities</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
    }
    h2 {
      font-size: 1.5rem;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      color: #333;
    }
    /* New styles for activity cards */
    .activity-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      background: #fff;
      max-width: 400px;
    }
    .activity-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }
    .activity-description {
      margin-bottom: 0.5rem;
      color: #555;
    }
    .activity-schedule {
      font-style: italic;
      margin-bottom: 0.5rem;
      color: #888;
    }
    .participants-section {
      margin-top: 0.7rem;
      background: #f8f9fa;
      border-radius: 6px;
      padding: 0.5rem;
    }
    .participants-section h4 {
      margin: 0 0 0.3rem 0;
      font-size: 1rem;
      color: #2980b9;
    }
    .participants-list {
      margin: 0;
      padding-left: 1.2rem;
      color: #34495e;
      font-size: 0.97rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mergington High School</h1>
    <h2>Extracurricular Activities</h2>
  </header>
  <div id="activities"></div>
  <script>
    async function fetchActivities() {
      const response = await fetch('/activities');
      return await response.json();
    }

    function renderActivities(activities) {
      const container = document.getElementById('activities');
      container.innerHTML = '';
      Object.entries(activities).forEach(([name, info]) => {
        const card = document.createElement('div');
        card.className = 'activity-card';

        card.innerHTML = `
          <div class="activity-title">${name}</div>
          <div class="activity-description">${info.description}</div>
          <div class="activity-schedule">${info.schedule}</div>
          <div><strong>Max participants:</strong> ${info.max_participants}</div>
          <div class="participants-section">
            <h4>Participants</h4>
            <ul class="participants-list">
              ${
                info.participants.length > 0
                  ? info.participants.map(email => `<li>${email}</li>`).join('')
                  : '<li><em>No participants yet</em></li>'
              }
            </ul>
          </div>
          <button class="signup-button" onclick="signupForActivity('${name}')">
            <i class="fas fa-user-plus"></i> Sign Up
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function signupForActivity(activityName) {
      const email = prompt("Enter your email to sign up:");
      if (email) {
        const response = await fetch(`/activities/${activityName}/signup?email=${encodeURIComponent(email)}`, {
          method: 'POST'
        });
        const result = await response.json();
        alert(result.message || 'Signed up successfully!');
        fetchActivities().then(renderActivities);
      }
    }

    fetchActivities().then(renderActivities);
  </script>
</body>
</html>
